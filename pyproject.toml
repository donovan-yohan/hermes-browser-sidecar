[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-browser-sidecar"
version = "0.2.0"
description = "Portable Hermes browser sidecar service"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Donovan Yohan" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
hermes-browser-sidecar = "hermes_browser_sidecar.cli:main"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

