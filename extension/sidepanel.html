<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hermes Browser Sidecar</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="panel-head">
        <p class="eyebrow">hermes browser sidecar</p>
        <h1 id="page-title" class="page-title">Loading…</h1>
        <p id="page-meta" class="meta-line"></p>
      </header>

      <section class="card chat-card">
        <div id="chat-messages" class="chat-messages" aria-live="polite">
          <p class="empty-state">No messages yet. Capabilities and upstream status appear in Options.</p>
        </div>

        <form id="chat-form" class="chat-form" autocomplete="off">
          <label class="checkbox-row">
            <input id="include-page" type="checkbox" checked>
            <span>Send active page context</span>
          </label>
          <textarea id="chat-input" placeholder="Ask Hermes…" rows="3"></textarea>
          <div class="button-row compact-row">
            <button id="send-button" type="submit">Send</button>
            <button id="reset-button" type="button" class="ghost">Reset</button>
            <button id="interrupt-button" type="button" class="ghost" hidden>Interrupt</button>
            <button id="refresh-button" type="button" class="ghost">Refresh</button>
            <button id="options-button" type="button" class="ghost">Options</button>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
