<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hermes Browser Sidecar Options</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">hermes-browser-sidecar</p>
        <h1>Options</h1>
        <p class="subhead">Point the extension at the local sidecar service. The extension intentionally does not talk to Hermes directly.</p>
      </header>

      <section class="card">
        <label class="field">
          <span>Backend URL</span>
          <input id="backend-url" type="url" spellcheck="false" placeholder="http://127.0.0.1:8787">
        </label>
        <label class="field">
          <span>Transport mode</span>
          <select id="transport-mode">
            <option value="hybrid">hybrid</option>
            <option value="bridge">bridge</option>
            <option value="api_server">api_server</option>
          </select>
        </label>
        <div class="button-row">
          <button id="save-button" type="button">Save</button>
          <button id="health-button" type="button" class="ghost">Check health</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
